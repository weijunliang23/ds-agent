<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-agent</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <span class="app-title">my-agent</span>
        <button id="btn-open-settings" class="btn-ghost" type="button">设置</button>
      </header>

      <div class="app-body">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-header">
            <span class="sidebar-title">对话记录</span>
            <button id="btn-new-chat" class="btn-icon" type="button" title="新建对话">＋</button>
            <button id="btn-batch-mode" class="btn-icon" type="button" title="批量删除">☑</button>
            <button id="btn-hide-sidebar" class="btn-icon" type="button" title="隐藏侧栏">◀</button>
          </div>
          <div id="conversation-list" class="conversation-list"></div>
          <div id="batch-bar" class="batch-bar" hidden>
            <span id="batch-count" class="batch-count">已选 0 项</span>
            <button id="btn-batch-delete" class="btn-danger" type="button" disabled>删除</button>
            <button id="btn-batch-cancel" class="btn-ghost" type="button">取消</button>
          </div>
        </aside>
        <button id="btn-show-sidebar" class="floating-btn" type="button" title="展开侧栏" hidden>☰</button>

        <main id="chat-view" class="chat-view">
        <div id="messages" class="messages"></div>
        <div class="chat-toolbar">
          <label class="toolbar-item">
            <input id="thinking-toggle" type="checkbox" checked />
            <span>思考模式</span>
          </label>
          <label class="toolbar-item">
            <span>思考强度</span>
            <select id="reasoning-effort">
              <option value="low">low</option>
              <option value="high" selected>high</option>
              <option value="max">max</option>
            </select>
          </label>
          <label class="toolbar-item">
            <input id="fim-toggle" type="checkbox" />
            <span>FIM 补全</span>
          </label>
        </div>
        <div id="permission-bar" class="permission-bar" hidden>
          <span id="permission-message" class="permission-info"></span>
          <div class="permission-actions">
            <button id="permission-deny" class="btn-ghost" type="button">拒绝</button>
            <button id="permission-allow" class="btn-primary" type="button">允许</button>
          </div>
        </div>
        <form id="chat-form" class="chat-form">
          <textarea
            id="input-message"
            class="input-message"
            rows="1"
            placeholder="输入消息，Enter 发送，Shift+Enter 换行"
          ></textarea>
          <button id="btn-stop" class="btn-stop" type="button" hidden>停止</button>
          <button id="btn-send" class="btn-primary" type="submit" disabled>发送</button>
        </form>
        <form id="fim-form" class="fim-form" hidden>
          <div class="fim-fields">
            <label class="fim-field">
              <span>前缀</span>
              <textarea id="input-prefix" rows="3" placeholder="输入前缀，模型补全中间内容"></textarea>
            </label>
            <label class="fim-field">
              <span>后缀（可选）</span>
              <textarea id="input-suffix" rows="3" placeholder="输入后缀"></textarea>
            </label>
          </div>
          <div class="fim-actions">
            <button id="btn-fim-send" class="btn-primary" type="submit">补全</button>
          </div>
        </form>
      </main>

      <section id="settings-view" class="settings-view" hidden>
        <form id="settings-form" class="settings-form">
          <h2>模型设置（多 Provider，按顺序回退）</h2>
          <div id="provider-list" class="provider-list"></div>
          <button id="btn-add-provider" class="btn-ghost" type="button">＋ 添加 Provider</button>
          <h2>上下文检索</h2>
          <label class="field-checkbox">
            <input id="set-retrieval-enabled" type="checkbox" checked />
            <span>启用历史上下文检索</span>
          </label>
          <label class="field">
            <span>检索片段数（topK）</span>
            <input id="set-context-top-k" type="number" min="1" max="20" placeholder="3" />
          </label>
          <label class="field">
            <span>最近消息窗口（原样保留条数）</span>
            <input id="set-context-recent-window" type="number" min="0" placeholder="8" />
          </label>
          <label class="field">
            <span>片段切分长度（字符）</span>
            <input id="set-context-chunk-size" type="number" min="100" placeholder="500" />
          </label>
          <h2>工具设置</h2>
          <label class="field">
            <span>工作区目录（允许读写的根目录，绝对路径；留空则每次询问）</span>
            <input id="set-workspace" type="text" autocomplete="off" placeholder="如 D:\work" />
          </label>
          <label class="field">
            <span>读取文件策略</span>
            <select id="set-read-policy">
              <option value="ask" selected>每次询问</option>
              <option value="allow">允许</option>
              <option value="deny">禁止</option>
            </select>
          </label>
          <label class="field">
            <span>写入文件策略</span>
            <select id="set-write-policy">
              <option value="ask" selected>每次询问</option>
              <option value="allow">允许</option>
              <option value="deny">禁止</option>
            </select>
          </label>
          <div class="form-actions">
            <button id="btn-save-settings" class="btn-primary" type="submit">保存</button>
            <button id="btn-close-settings" class="btn-ghost" type="button">返回</button>
          </div>
          <p id="settings-status" class="status" role="status"></p>
        </form>
      </section>
      </div>
    </div>

    <div id="confirm-modal" class="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-card">
        <p id="confirm-message" class="modal-message"></p>
        <div class="modal-actions">
          <button id="confirm-cancel" class="btn-ghost" type="button">取消</button>
          <button id="confirm-ok" class="btn-danger" type="button">确定删除</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
